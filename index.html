<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rupam Mallick — Operations Leader at DoorDash | Contact Center Operations, Customer Experience (Consumer, Dasher, Merchant), Analytics & BI, Lean Six Sigma Black Belt.">
<title>Rupam Mallick — DoorDash Operations Leader | Customer Experience & BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --dd-red: #FF3008;
  --dd-red-cta: #EB1700;
  --dd-red-dark: #B81100;
  --dd-red-soft: #FFF0ED;
  --dd-red-border: #FFD4CC;
  --bg-canvas: #FFFDF9;
  --bg-soft: #F5F4F0;
  --bg-card: #FFFFFF;
  --bg-glass: rgba(255, 253, 249, 0.90);
  --ink: #191919;
  --ink-secondary: #484848;
  --muted: #6E6E6E;
  --line: #E6E4E0;
  --green: #12804A;
  --green-soft: #E7F7EF;
  --amber: #D97706;
  --shadow-sm: 0 6px 20px rgba(25, 25, 25, 0.05);
  --shadow-lg: 0 24px 60px rgba(25, 25, 25, 0.10);
  --radius-lg: 26px;
  --radius-md: 18px;
}

[data-theme="dark"] {
  --dd-red: #FF4422;
  --dd-red-cta: #FF3008;
  --dd-red-dark: #FF6247;
  --dd-red-soft: rgba(255, 48, 8, 0.14);
  --dd-red-border: rgba(255, 48, 8, 0.32);
  --bg-canvas: #0D0E11;
  --bg-soft: #14161B;
  --bg-card: #1A1D24;
  --bg-glass: rgba(13, 14, 17, 0.90);
  --ink: #F5F6F8;
  --ink-secondary: #C5C8D2;
  --muted: #8C909E;
  --line: #272B35;
  --green: #32D583;
  --green-soft: rgba(50, 213, 131, 0.14);
  --shadow-sm: 0 6px 22px rgba(0, 0, 0, 0.40);
  --shadow-lg: 0 26px 65px rgba(0, 0, 0, 0.60);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 84px;
}

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-canvas);
  color: var(--ink);
  line-height: 1.65;
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
}

/* Sticky Navigation */
nav {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}

.nav-inner {
  height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 18.5px;
  letter-spacing: -0.5px;
}

.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--dd-red);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  box-shadow: 0 6px 16px rgba(255, 48, 8, 0.32);
}

.brand span {
  color: var(--dd-red);
}

.brand-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--dd-red-soft);
  color: var(--dd-red);
  border: 1px solid var(--dd-red-border);
  margin-left: 4px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-links a {
  font-size: 13.5px;
  font-weight: 600;
  padding: 8px 13px;
  border-radius: 999px;
  color: var(--ink-secondary);
  transition: all 0.2s ease;
}

.nav-links a:hover {
  background: var(--dd-red-soft);
  color: var(--dd-red);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.2s ease;
}

.icon-btn:hover {
  border-color: var(--dd-red);
  color: var(--dd-red);
}

.nav-cta {
  background: var(--dd-red-cta);
  color: #fff !important;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s ease, transform 0.15s ease;
}

.nav-cta:hover {
  background: var(--dd-red-dark);
  transform: translateY(-1px);
}

@media (max-width: 920px) {
  .nav-links, .brand-sub {
    display: none;
  }
}

/* Hero Section */
.hero {
  padding: 72px 0 60px;
  position: relative;
  background:
    radial-gradient(circle at 86% 14%, rgba(255, 48, 8, 0.11), transparent 34%),
    radial-gradient(circle at 8% 82%, rgba(255, 48, 8, 0.05), transparent 28%);
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 44px;
  align-items: center;
}

@media (max-width: 960px) {
  .hero-grid {
    grid-template-columns: 1fr;
  }
}

.kicker-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--dd-red);
  background: var(--dd-red-soft);
  border: 1px solid var(--dd-red-border);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--dd-red);
  box-shadow: 0 0 0 0 rgba(255, 48, 8, 0.7);
  animation: pulseRing 1.8s infinite;
}

@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(255, 48, 8, 0.65); }
  70% { box-shadow: 0 0 0 8px rgba(255, 48, 8, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 48, 8, 0); }
}

.lssbb-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-secondary);
}

.hero h1 {
  font-family: 'Manrope', sans-serif;
  font-size: clamp(44px, 6vw, 70px);
  line-height: 0.98;
  letter-spacing: -2.5px;
  margin: 20px 0 16px;
}

.hero h1 span {
  color: var(--dd-red);
}

.subtitle {
  font-size: clamp(17px, 2vw, 20.5px);
  font-weight: 600;
  color: var(--ink);
  max-width: 680px;
  line-height: 1.4;
}

.summary {
  color: var(--ink-secondary);
  font-size: 15.5px;
  max-width: 680px;
  margin-top: 16px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 28px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 21px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.btn-primary {
  background: var(--dd-red-cta);
  color: #fff;
  border-color: var(--dd-red-cta);
  box-shadow: 0 10px 24px rgba(235, 23, 0, 0.24);
}

.btn-primary:hover {
  background: var(--dd-red-dark);
  transform: translateY(-2px);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--ink);
}

.btn-secondary:hover {
  border-color: var(--dd-red);
  color: var(--dd-red);
  transform: translateY(-2px);
}

/* DoorDash Marketplace Command Console (Hero Right) */
.command-card {
  background: #121318;
  color: #FFFFFF;
  border-radius: 28px;
  padding: 26px;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255, 255, 255, 0.09);
  position: relative;
  overflow: hidden;
}

.command-card::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 48, 8, 0.26) 0%, transparent 70%);
  top: -90px;
  right: -90px;
  pointer-events: none;
}

.cmd-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.cmd-id {
  display: flex;
  align-items: center;
  gap: 14px;
}

.initials {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: linear-gradient(135deg, #FF3008 0%, #B81100 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Manrope', sans-serif;
  font-size: 21px;
  font-weight: 800;
  color: #fff;
  box-shadow: 0 8px 20px rgba(255, 48, 8, 0.35);
}

.cmd-title h2 {
  font-family: 'Manrope', sans-serif;
  font-size: 18.5px;
  font-weight: 800;
}

.cmd-title p {
  font-size: 12px;
  color: #A2A6B3;
  margin-top: 2px;
}

.live-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  background: rgba(18, 128, 74, 0.24);
  color: #4AE38C;
  border: 1px solid rgba(74, 227, 140, 0.32);
  padding: 5px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

/* 3-Sided Marketplace Dispatch Telemetry Stage */
.dispatch-stage {
  background: #1B1D24;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 14px;
  position: relative;
}

.stage-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10.5px;
  color: #9CA0AE;
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 8px;
}

.stage-header span strong {
  color: #fff;
}

.dispatch-svg {
  width: 100%;
  height: 68px;
  display: block;
}

.route-path {
  stroke-dasharray: 6 6;
  animation: dashMove 10s linear infinite;
}

@keyframes dashMove {
  to {
    stroke-dashoffset: -120;
  }
}

/* Interactive LOB Switcher inside Hero Card */
.lob-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: #1B1D24;
  padding: 5px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.lob-tab {
  background: transparent;
  border: 0;
  color: #9CA0AE;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 6px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.lob-tab.active {
  background: var(--dd-red);
  color: #fff;
}

.lob-panel {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 13px 15px;
  font-size: 12.5px;
  color: #D5D7DF;
}

.lob-panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.lob-panel-head strong {
  color: #fff;
  font-size: 13px;
}

.lob-kpi-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: #FF856D;
  background: rgba(255, 48, 8, 0.16);
  padding: 2px 8px;
  border-radius: 6px;
}

.cmd-meta {
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid rgba(255, 255, 255, 0.09);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 11.5px;
}

.cmd-meta div span {
  color: #8E929F;
  display: block;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
}

.cmd-meta div b {
  color: #fff;
  font-weight: 700;
}

/* KPI Stats Strip */
.stats-section {
  padding: 6px 0 38px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

@media (max-width: 960px) {
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 520px) {
  .stat-grid {
    grid-template-columns: 1fr;
  }
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.stat-card:hover {
  transform: translateY(-3px);
  border-color: var(--dd-red);
}

.stat-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.stat-val {
  font-family: 'Manrope', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: var(--dd-red);
  letter-spacing: -1px;
}

.stat-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 6px;
  background: var(--dd-red-soft);
  color: var(--dd-red);
}

.stat-label {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  margin-top: 6px;
}

.stat-sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
}

.stat-bar {
  height: 4px;
  background: var(--bg-soft);
  border-radius: 99px;
  margin-top: 12px;
  overflow: hidden;
}

.stat-bar-fill {
  height: 100%;
  background: var(--dd-red);
  border-radius: 99px;
}

/* Section Scaffolding */
section {
  padding: 76px 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 32px;
}

.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--dd-red);
}

.section-title {
  font-family: 'Manrope', sans-serif;
  font-size: clamp(28px, 3.8vw, 42px);
  letter-spacing: -1.3px;
  margin-top: 6px;
  line-height: 1.1;
}

.section-lede {
  color: var(--ink-secondary);
  max-width: 660px;
  margin-top: 10px;
  font-size: 15.5px;
}

/* Executive WBR / MBR & Wave 0 Command Blueprint Section */
.wbr-section {
  background: var(--bg-soft);
  border-top: 1px solid var(--line);
}

.wbr-console {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 28px;
  box-shadow: var(--shadow-sm);
}

.wbr-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.wbr-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wbr-tab {
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  color: var(--ink-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

.wbr-tab.active {
  background: var(--dd-red);
  color: #fff;
  border-color: var(--dd-red);
}

.wbr-pane {
  display: none;
}

.wbr-pane.active {
  display: block;
}

.wbr-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

@media (max-width: 860px) {
  .wbr-grid-4 {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 520px) {
  .wbr-grid-4 {
    grid-template-columns: 1fr;
  }
}

.telemetry-box {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
}

.telemetry-box .t-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

.telemetry-box .t-num {
  font-family: 'Manrope', sans-serif;
  font-size: 27px;
  font-weight: 800;
  color: var(--ink);
  margin: 8px 0 4px;
}

.telemetry-box .t-delta {
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
}

.telemetry-box p {
  font-size: 12.5px;
  color: var(--ink-secondary);
  margin-top: 8px;
}

/* Pareto / DMAIC Visualizer */
.pareto-list {
  display: grid;
  gap: 12px;
}

.pareto-row {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
}

.pareto-top {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 6px;
}

.pareto-top span:last-child {
  font-family: 'JetBrains Mono', monospace;
  color: var(--dd-red);
}

.pareto-track {
  height: 8px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}

.pareto-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--dd-red) 0%, #FF7A59 100%);
  border-radius: 99px;
}

.pareto-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

/* Career Velocity Progression Bar */
.velocity-banner {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.velocity-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.velocity-steps {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

@media (max-width: 820px) {
  .velocity-steps {
    grid-template-columns: 1fr;
  }
}

.v-step {
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--bg-soft);
  border-left: 3px solid var(--line);
  font-size: 12.5px;
}

.v-step.active-role {
  background: var(--dd-red-soft);
  border-left-color: var(--dd-red);
}

.v-step time {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--muted);
}

.v-step strong {
  display: block;
  color: var(--ink);
  margin-top: 2px;
  font-size: 13px;
}

.v-step span {
  font-size: 11.5px;
  color: var(--ink-secondary);
}

/* Filter Bar for Experience & Tools */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter-btn {
  padding: 8px 15px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--ink-secondary);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

.filter-btn:hover {
  border-color: var(--dd-red);
  color: var(--dd-red);
}

.filter-btn.active {
  background: var(--dd-red);
  color: #fff;
  border-color: var(--dd-red);
}

/* Experience Timeline */
.experience {
  background: var(--bg-soft);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.timeline {
  display: grid;
  gap: 20px;
}

.job {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 30px;
